<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lung Cancer Prediction AI</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <!-- ===================================== -->
        <!-- TITLE -->
        <!-- ===================================== -->

        <div class="title">

            <h1>🫁 Lung Cancer Prediction AI</h1>

            <p>
                Advanced Machine Learning Prediction System
                using Logistic Regression, Random Forest &
                Naive Bayes
            </p>

        </div>

        <!-- ===================================== -->
        <!-- FORM BOX -->
        <!-- ===================================== -->

        <div class="form-box">

            <form action="/predict" method="POST">

                <!-- AGE -->

                <div class="input-group">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        placeholder="Enter Age"
                        required
                    >

                </div>

                <!-- GENDER -->

                <div class="input-group">

                    <label>Gender</label>

                    <select name="gender" required>

    <option value="2">Female</option>

    <option value="1">Male</option>

</select>

                </div>

                <!-- WEIGHT -->

                <div class="input-group">

                    <label>Weight (kg)</label>

                    <input
                        type="number"
                        step="0.1"
                        name="weight"
                        placeholder="Enter Weight"
                        required
                    >

                </div>

                <!-- SMOKING START AGE -->

                <div class="input-group">

                    <label>Smoking Start Age</label>

                    <input
                        type="number"
                        name="smokeage"
                        placeholder="Smoking Start Age"
                        required
                    >

                </div>

                <!-- CIGARETTES PER DAY -->

                <div class="input-group">

                    <label>Cigarettes Per Day</label>

                    <input
                        type="number"
                        name="smokeday"
                        placeholder="Cigarettes Per Day"
                        required
                    >

                </div>

                <!-- SMOKING YEARS -->

                <div class="input-group">

                    <label>Smoking Years</label>

                    <input
                        type="number"
                        name="smokeyr"
                        placeholder="Smoking Years"
                        required
                    >

                </div>

                <!-- PACK YEARS -->

                <div class="input-group">

                    <label>Pack Years</label>

                    <input
                        type="number"
                        step="0.1"
                        name="pkyr"
                        placeholder="Auto Calculated"
                        readonly
                        required
                    >

                </div>

                <!-- AGE QUIT -->

                <div class="input-group">

                    <label>Age Quit Smoking</label>

                    <input
                        type="number"
                        name="age_quit"
                        placeholder="Age Quit Smoking"
                        required
                    >

                </div>

                <!-- CIGARETTE SMOKER -->

                <div class="input-group">

                    <label>Cigarette Smoker</label>

                    <select name="cigsmok" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- PIPE -->

                <div class="input-group">

                    <label>Pipe Smoking</label>

                    <select name="pipe" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- CIGAR -->

                <div class="input-group">

                    <label>Cigar Smoking</label>

                    <select name="cigar" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- PASSIVE HOME -->

                <div class="input-group">

                    <label>Passive Smoking At Home</label>

                    <select name="smokelive" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- PASSIVE WORK -->

                <div class="input-group">

                    <label>Smoking Exposure At Work</label>

                    <select name="smokework" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- FIRE -->

                <div class="input-group">

                    <label>Years Exposed To Fire/Smoke</label>

                    <input
                        type="number"
                        name="yrsfire"
                        placeholder="Years Exposed"
                        required
                    >

                </div>

                <!-- NODULE -->

                <div class="input-group">

                    <label>Lung Nodule Detected</label>

                    <select name="anyscr_has_nodule" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- LESION -->

                <div class="input-group">

                    <label>Lesion Size</label>

                    <input
                        type="number"
                        step="0.1"
                        name="lesionsize"
                        placeholder="Lesion Size"
                        required
                    >

                </div>

                <!-- COPD -->

                <div class="input-group">

                    <label>COPD Diagnosis Age</label>

                    <input
                        type="number"
                        name="agecopd"
                        placeholder="COPD Diagnosis Age"
                        required
                    >

                </div>

                <!-- BRONCHITIS -->

                <div class="input-group">

                    <label>Bronchitis Diagnosis Age</label>

                    <input
                        type="number"
                        name="agebron"
                        placeholder="Bronchitis Diagnosis Age"
                        required
                    >

                </div>

                <!-- MOTHER -->

                <div class="input-group">

                    <label>Mother Had Lung Cancer</label>

                    <select name="fammother" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- SISTER -->

                <div class="input-group">

                    <label>Sister Had Lung Cancer</label>

                    <select name="famsister" required>

                        <option value="0">No</option>

                        <option value="1">Yes</option>

                    </select>

                </div>

                <!-- BUTTON -->

                <div class="full-width">

                    <button class="btn">

                        Predict Lung Cancer Risk

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <script
        src="{{ url_for('static', filename='script/index.js') }}"
    ></script>

</body>

</html>
